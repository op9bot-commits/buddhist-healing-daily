name: Verify Daily Report on Main

on:
  schedule:
    # 08:30 Asia/Shanghai = 00:30 UTC — after Cursor Automation at 08:00
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check today's report exists on main
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          FILE="日报/${TODAY}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::Missing daily report on main: ${FILE}"
            exit 1
          fi
          echo "OK: ${FILE} exists ($(wc -c < "$FILE") bytes)"
