name: Apply Monk Quotes Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Apply Cursor automation
        env:
          CURSOR_TOKEN: ${{ secrets.CURSOR_TOKEN }}
        run: bash scripts/apply-monk-quotes-automation.sh
