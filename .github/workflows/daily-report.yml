name: Generate Daily Report

on:
  schedule:
    # Every day at 08:00 Asia/Shanghai (= 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate today's date
        id: date
        run: echo "today=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check if report already exists
        id: check
        run: |
          if [ -f "日报/${{ steps.date.outputs.today }}.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if report exists (use Codex heartbeat instead)
        if: steps.check.outputs.exists == 'true'
        run: echo "Report for ${{ steps.date.outputs.today }} already exists. Skipping."

      - name: Create placeholder if needed
        if: steps.check.outputs.exists != 'true'
        run: |
          mkdir -p 日报
          cat > "日报/${{ steps.date.outputs.today }}.placeholder.md" << 'PLACEHOLDER'
# 赛博韩信日报｜佛教情感疗愈赛道｜PLACEHOLDER_DATE

> 此报告待 Codex 自动化触发后由 AI 生成完整内容。
> 当前为占位文件，请通过 Codex automation 设置每日定时任务来替换此文件。
PLACEHOLDER
          sed -i "s|PLACEHOLDER_DATE|${{ steps.date.outputs.today }}|" "日报/${{ steps.date.outputs.today }}.placeholder.md"
          mv "日报/${{ steps.date.outputs.today }}.placeholder.md" "日报/${{ steps.date.outputs.today }}.md"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 日报/
          git diff --cached --quiet || git commit -m "update daily report ${{ steps.date.outputs.today }}" || true

      - name: Push changes
        run: |
          git push origin main
