name: Auto-merge Cursor Daily Report PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark draft PR ready for review
        if: github.event.pull_request.draft == true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              draft: false,
            });

      - name: Merge PR into main
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'merge',
              });
              console.log(`Merged PR #${pr.number} into main`);
            } catch (error) {
              if (error.status === 405) {
                core.setFailed('PR not mergeable yet; will retry on synchronize.');
              } else {
                throw error;
              }
            }
